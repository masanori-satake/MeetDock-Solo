repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: bash -c "npm install --no-audit --no-fund && npm run lint"
        language: node
        additional_dependencies: []
        pass_filenames: false
        files: ^src/
      - id: check-types
        name: check-types
        entry: bash -c "npm install --no-audit --no-fund && npm run check-types"
        language: node
        additional_dependencies: []
        pass_filenames: false
        files: ^src/
