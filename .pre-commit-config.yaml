repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
  - repo: local
    hooks:
      - id: check-version
        name: check version bump and consistency
        entry: bash -c 'if command -v node >/dev/null 2>&1; then node scripts/check-version.js --check-bump; else echo "Warning: node executable not found in PATH. Skipping local version check."; fi'
        language: system
        pass_filenames: false
