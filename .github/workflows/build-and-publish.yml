name: Build, Package and Release

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check Version Bump and Consistency
        env:
          VERSION_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
        run: node scripts/check-version.js --check-bump

      - name: Run Lint
        run: npm run lint

      - name: Run Tests
        run: xvfb-run --auto-servernum npm test

      - name: Package Extension (.vsix)
        run: npx @vscode/vsce package --no-git-tag-version

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-vsix
          path: "*.vsix"

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download VSIX Artifact
        uses: actions/download-artifact@v4
        with:
          name: extension-vsix

      - name: Determine VSIX File Path
        id: vsix_info
        run: |
          VSIX_PATH=$(ls *.vsix | head -n 1)
          echo "vsix_path=${VSIX_PATH}" >> $GITHUB_OUTPUT

      - name: Publish to Visual Studio Marketplace
        id: vsce_publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          PACKAGE_PATH: ${{ steps.vsix_info.outputs.vsix_path }}
        run: |
          OUTPUT=$(npx @vscode/vsce publish --packagePath "$PACKAGE_PATH" --skip-duplicate 2>&1) || {
            echo "$OUTPUT"
            exit 1
          }
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -qiE "(already exists|already published\. Skipping publish\.)"; then
            echo "skipped=true" >> $GITHUB_OUTPUT
          else
            echo "skipped=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to Open VSX Registry
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          PACKAGE_PATH: ${{ steps.vsix_info.outputs.vsix_path }}
        run: |
          npx ovsx publish "$PACKAGE_PATH" -p "$OVSX_PAT" --no-dependencies --skip-duplicate

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Create or Update Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_PATH: ${{ steps.vsix_info.outputs.vsix_path }}
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: ${{ steps.get_version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: "${{ env.PACKAGE_PATH }}"
          generate_release_notes: true
