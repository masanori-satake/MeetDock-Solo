name: 'セキュリティスキャン (Security Scan)'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/security-scan.yml'
  schedule:
    - cron: '0 0 * * 0' # 毎週日曜 0:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  security-events: write
  contents: read

jobs:
  security:
    name: '共通セキュリティスキャン実行 (Execute Base Security)'
    uses: masanori-satake/common-workflows/.github/workflows/base-security.yml@v1
    with:
      # VSCode 拡張機能は ./projects ディレクトリを持たないため、
      # ルートの package.json / package-lock.json のみをスキャン対象とする
      osv_scan_args: |-
        --recursive
        ./package.json
        ./package-lock.json
